{n:'Dongfang Insulation',s:[4,4,4,4,3],cf:'Medium',u:[['Power-capacitor BOPP film; 6014-H high-temperature metallising base, 2.8–12 µm','https://www.dongfang-insulation.com/polypropylene-bopp-film-for-capacitor-product/','company page, undated']],v:'Confirm film grade against DC-link lifetime and thermal specs, and Delta Capacitor requalification effort.'},
{n:'Cosmo First',s:[3,4,3,2,3],cf:'Medium',u:[['Metallised capacitor-grade BOPP films, 2.5–12 µm, clean-room production','https://printweek.in/news/cosmo-first-launches-metalised-capacitor-grade-bopp-films-58334','15 Jan 2024 (launched Dec 2023)']],v:'Recent entrant to capacitor film: confirm production track record, volumes and thermal grades.'}]}};
const FW=[['Technical capability',30],['Application relevance',25],['Footprint & scale',15],['Industry presence',15],['Qualification readiness',15]];
const fit=s=>s?f0(s.reduce((a,v,i)=>a+v/5*FW[i][1],0)):null;
const vis={tab:'ov',prod:'',hyp:1,alt:'439'};
const TABS=[['ov','Overview'],['nw','Network'],['rk','Risk scorecard'],['al','Alerts'],['at','Alternates'],['me','Method & exclusions']];
const chip=(t,c='')=>`<span class="chip ${c}">${t}</span>`,bc=id=>chip(`${SC[id].b} · ${f0(SC[id].p)}`,BC[SC[id].b]),kc=k=>chip(KN[k]);
const nl=id=>`<button class="l" data-n="${id}">${nm(id)}</button>`;
function go(t,x){vis.tab=t;if(x)vis.alt=x;draw();closeD();scrollTo(0,0)}
function draw(){$('#nv').innerHTML=TABS.map(([k,t])=>`<button class="${vis.tab==k?'on':''}" data-t="${k}">${t}</button>`).join('');$('#m').innerHTML=({ov,nw,rk,al,at,me})[vis.tab]()}
function closeD(){$('#dr').classList.remove('o')}
function openD(h){const d=$('#dr');d.innerHTML=`<div style="text-align:right"><button class="b" data-x="1">Close ✕</button></div>`+h;d.classList.add('o');d.scrollTop=0}
function ov(){const r=ranked().filter(id=>clsOf(id)!='H').slice(0,8),cnt=k=>L.filter(l=>l.k==k).length,act=EVT.filter(e=>e[6]=='A').length,z1=IDS.filter(id=>N[id][3]=='Z01'&&clsOf(id)!='H');
return`<div class="g"><div class="cd"><div class="k">${IDS.length-1}</div>network entities (${[1,2,3].map(t=>IDS.filter(i=>N[i][1]==t).length+' T'+t).join(' · ')})</div>
<div class="cd"><div class="k">${cnt('C')}/${cnt('I')}/${cnt('H')}</div>links: confirmed / inferred / hypothesis</div>
<div class="cd"><div class="k">${act}</div>actionable alerts of ${EVT.length} signals <button class="l" data-t="al">open</button></div>
<div class="cd"><div class="k">$${rv(new Set(['P1','P2','P3']))}m</div>annual revenue behind one die source (IonPeak) <button class="l" data-n="439">inspect</button></div></div>
<div class="cd"><h2>Hidden dependencies a Tier-1 view misses</h2><ul>
<li><b>Same die behind two "diversified" assemblers.</b> Aster and Boreal both depend on IonPeak SITE-074; no second die source is qualified (DOC-078). All three products sit on M10/M20. <button class="l" data-n="439">Open IonPeak</button></li>
<li><b>Common ownership.</b> CommonSpan consolidates Aster and Boreal, so the 60/40 and 70/30 splits are site redundancy, not independent ownership (DOC-075). <button class="l" data-n="247">Open Aster</button></li>
<li><b>Geographic cluster.</b> ${z1.map(nl).join(', ')} all sit in Z01 under an active flood watch, with the highest hazard, logistics and infrastructure indices (82/76/71).</li>
<li><b>Sole-source Tier-1.</b> Cobalt supplies 100% of C10 to all three products; Jade substrate sits behind it too. <button class="l" data-n="119">Open Cobalt</button></li>
<li><b>Financial stress upstream.</b> Meridian (current ratio 0.62, ND/EBITDA 7.2, on-time down 17.6pp) feeds the only C20 supplier, touching P1 and P2. <button class="l" data-n="210">Open Meridian</button></li></ul></div>
<div class="cd"><h2>Top priorities (risk × business criticality)</h2><div class="wrap"><table><tr><th>Node</th><th>Tier</th><th>Priority</th><th>Evidence conf.</th><th>Why</th></tr>${r.map(id=>`<tr class="cl" data-n="${id}"><td>${nm(id)}</td><td>T${N[id][1]}</td><td>${bc(id)}</td><td>${SC[id].cf}/100</td><td class="sub">${why(id)}</td></tr>`).join('')}</table></div>
<p class="sub">Priority = prudent risk score × share of revenue that depends on the node. Evidence confidence is reported separately and never lowers risk.</p></div>`}
function why(id){const d=SC[id].r.d,t=Object.keys(W).filter(k=>d[k]!=null).sort((a,b)=>d[b]*W[b]-d[a]*W[a]).slice(0,2).map(k=>WL[k].toLowerCase()+' '+f0(d[k]));return`${f0(SC[id].c)}% revenue dependent; top drivers: ${t.join(', ')}${SC[id].r.gap.length?'; missing data imputed at 60':''}`}
function nw(){const T={3:[455,736,873,179,520,659,'AB'],2:[439,453,708,210,329,320,728,942,469,849,274],1:[247,725,119,103,176,922,287,786]},CX={3:10,2:225,1:440},H=520,pos={};
for(const t in T)T[t].forEach((id,i)=>{id=String(id);if(!vis.hyp&&clsOf(id)=='H')return;pos[id]=[CX[t],(i+.5)*H/T[t].length+14]});
const P=['P1','P2','P3'],py=p=>130+P.indexOf(p)*130,dim=id=>vis.prod&&!prods(id).has(vis.prod),lp=(a,b)=>`M${a[0]+150} ${a[1]+17}C${a[0]+185} ${a[1]+17},${b[0]-35} ${b[1]},${b[0]} ${b[1]}`;
let s='',pl=new Set;L.forEach((l,i)=>{if(l.d=='ND')CO[l.c][1].forEach(p=>{const k=l.s+p;if(pl.has(k))return;pl.add(k);const o=dim(l.s)||(vis.prod&&p!=vis.prod)?.12:.5;s+=`<path d="M${pos[l.s][0]+150} ${pos[l.s][1]+17}C${pos[l.s][0]+185} ${pos[l.s][1]+17},625 ${py(p)},660 ${py(p)}" fill="none" style="stroke:var(--mu)" opacity="${o}"/>`});else if(pos[l.s]&&pos[l.d]){const o=dim(l.s)||dim(l.d)?.12:.8,d=lp(pos[l.s],[pos[l.d][0],pos[l.d][1]+17]);s+=`<path d="${d}" fill="none" style="stroke:var(--mu)" stroke-width="1.6" ${l.k=='I'?'stroke-dasharray="6 4"':l.k=='H'?'stroke-dasharray="2 4"':''} opacity="${o}"/><path d="${d}" fill="none" stroke="transparent" stroke-width="10" data-l="${i}" style="cursor:pointer"><title>${nm(l.s)} → ${nm(l.d)}: ${l.c} (${KN[l.k]})</title></path>`}});
for(const id in pos){const[x,y]=pos[id],c=`var(--${BC[SC[id].b]})`;s+=`<g class="nd" data-n="${id}" opacity="${dim(id)?.2:1}"><rect x="${x}" y="${y}" width="150" height="34" rx="6" style="stroke:${c}" ${clsOf(id)=='I'?'stroke-dasharray="6 3"':clsOf(id)=='H'?'stroke-dasharray="2 3"':''}/><text x="${x+7}" y="${y+14}">${nm(id).slice(0,24)}</text><text class="m" x="${x+7}" y="${y+27}">${SC[id].b} ${f0(SC[id].p)} · conf ${SC[id].cf}</text></g>`}
P.forEach(p=>s+=`<rect x="660" y="${py(p)-24}" width="130" height="48" rx="6" style="fill:var(--cd);stroke:var(--ac)" stroke-width="2"/><text x="668" y="${py(p)-6}">${p} ${PN[p]}</text><text class="m" x="668" y="${py(p)+10}">$${REV[p]}m · NovaDrive</text>`);
s+=[['Tier-3',10],['Tier-2',225],['Tier-1',440],['Products',660]].map(([t,x])=>`<text class="m" x="${x}" y="12">${t}</text>`).join('');
return`<div class="cd"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><label>Trace product <select id="fp"><option value="">All</option>${P.map(p=>`<option ${vis.prod==p?'selected':''}>${p}</option>`).join('')}</select></label><label><input type="checkbox" id="fh" ${vis.hyp?'checked':''}> show hypotheses</label><span class="sub">Border colour = priority band (label inside the node). Solid = confirmed, dashed = inferred, dotted = hypothesis. Click a node or an upstream link for evidence.</span></div></div><div class="cd wrap"><svg viewBox="0 0 800 ${H+20}" style="min-width:760px;width:100%">${s}</svg></div>`}
function rk(){const rows=ranked();return`<div class="cd"><h2>Supplier & node scorecard</h2><p class="sub">Dimension scores are 0–100 (higher = riskier). "n/a" means the workbook has no value: it is imputed at 60 in the prudent score, never treated as low risk. Click a row to see the arithmetic and the evidence.</p><div class="wrap"><table><tr><th>Node</th><th>T</th><th>Link class</th><th>Fin</th><th>Ops</th><th>Geo</th><th>Assur.</th><th>Concn.</th><th>Risk (prudent)</th><th>Crit.</th><th>Priority</th><th>Evid. conf.</th></tr>${rows.map(id=>{const{r,c,cf}=SC[id],d=r.d,v=x=>x==null?'n/a':f0(x);return`<tr class="cl" data-n="${id}"><td>${nm(id)}</td><td>${N[id][1]}</td><td>${kc(clsOf(id))}</td><td>${v(d.fin)}</td><td>${v(d.op)}</td><td>${v(d.geo)}</td><td>${v(d.asr)}</td><td>${v(d.str)}</td><td>${f0(r.pru)}${r.gap.length?` <span class="sub">(known-only ${f0(r.kn)})</span>`:''}</td><td>${f0(c)}</td><td>${bc(id)}</td><td>${cf}</td></tr>`}).join('')}</table></div></div>`}
function al(){return`<div class="cd"><h2>Event feed → matched alerts</h2><p class="sub">Each signal runs through five steps: identity match, duplicate check, date validity, network context, action. Rejected signals are shown with the reason, not hidden.</p></div>`+EVT.map((e,i)=>{const m=EM[i],c=e[6],sp=e[5],good=c=='A'||c=='I';return`<div class="cd"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${e[0]} · ${e[2]}</b><span>${chip(CL[c],c=='A'?'hi':c=='U'?'md':'')}${e[7]?chip(e[7],e[7]=='High'?'hi':e[7]=='Info'?'':'md'):''}</span></div><div class="sub">Published ${e[1]} · source family ${e[4]}</div><p>${e[3]}</p>
<div class="step"><b>1 Identity:</b> ${sp.z?`zone ${sp.z} matched to ${m.n.length} network facilities: ${m.n.map(nl).join(', ')}${m.n.some(id=>clsOf(id)=='I')?' (Verdant is an inferred link)':''}.`:sp.e?`entity ${nl(sp.e)} matched by legal name.`:sp.rej?sp.rej:sp.dup?'matches '+sp.dup:'port named, but no lane or zone mapping exists in the supplied network data; no entity can be matched.'}</div>
<div class="step"><b>2 Duplicate:</b> ${sp.dup?`same source family as ${sp.dup}: merged, no independent evidence added.`:'independent source family.'}</div>
<div class="step"><b>3 Date validity:</b> ${c=='S'?'stale, effective 2023-11-03.':'current at case cut-off.'}</div>
${good?`<div class="step"><b>4 Network context:</b> flows through ${[...m.r.cp].join(', ')} via ${[...m.r.t1].map(nl).join(', ')}; products ${[...m.p].join(', ')} ($${m.rev}m, ${f0(m.rev/TOT*100)}% of revenue).${sp.info?' '+sp.info:''}</div>`:''}
${e[8]?`<div class="step"><b>5 Action:</b> ${e[8]}</div>`:''}
${good&&sp.e&&c=='A'?`<button class="b" data-a="${sp.e}">Find alternates</button> `:''}${(sp.ev||[]).length?`<span class="sub">Evidence: ${sp.ev.join(', ')}</span>`:''}</div>`}).join('')}
function at(){const ids=Object.keys(AL),a=AL[vis.alt],cps=[...reach(vis.alt).cp];
return`<div class="cd"><h2>Alternate-supplier search</h2><label>Flagged node <select id="fa">${ids.map(i=>`<option value="${i}" ${vis.alt==i?'selected':''}>${nm(i)} (${SC[i].b} ${f0(SC[i].p)})</option>`).join('')}</select></label>
<p class="sub">Searches were run on 4 Oct 2026 from public pages; this page holds that snapshot and cannot search live. To refresh or add nodes, ask Claude to re-run the search for the node.</p>
<h3>Search brief (from component context)</h3><ul>${cps.map(c=>`<li><b>${c} ${CO[c][0]}</b>: ${CO[c][3]}. Used in ${CO[c][1].join(', ')}; qualification lead time ${CO[c][2]} weeks. Screen for ${CO[c][4]}.</li>`).join('')}</ul><p>${a.note} <button class="l" data-n="${vis.alt}">Open node evidence</button></p></div>
<div class="cd"><h2>Shortlist for ${a.cp}</h2><p class="sub">Fitment = weighted 1–5 analyst scores (${FW.map(f=>f[0]+' '+f[1]+'%').join(', ')}). It is public-evidence screening only and is separate from supplier risk, which is not scored for alternates because no financial or operating data is supplied for them.</p><div class="wrap"><table><tr><th>Candidate</th><th>Fitment</th>${FW.map(f=>`<th>${f[0].split(' ')[0]}</th>`).join('')}<th>Evidence quality</th></tr>${a.c.map((c,i)=>`<tr class="cl" data-c="${i}"><td><b>${c.n}</b></td><td>${c.s?fit(c.s)+'/100<div class="bar"><i style="width:'+fit(c.s)+'%"></i></div>':'unscored'}</td>${FW.map((f,j)=>`<td>${c.s?c.s[j]:'–'}</td>`).join('')}<td>${chip(c.cf)}</td></tr>`).join('')}</table></div><p class="sub">Click a row for sources, dates and the validation list.</p></div>`}
function me(){return`<div class="cd"><h2>Method</h2><ul><li><b>Evidence classes.</b> Confirmed = disclosed award or input supply with a matching entity, site, component and date. Inferred = candidate link needing validation. Hypothesis = lead only; never asserted. Shipment manifests and allocations are planning or partial signals, not spend.</li><li><b>Risk.</b> Weighted 0–100 across ${Object.keys(W).map(k=>WL[k]+' '+W[k]+'%').join(', ')}. Financial = half current-ratio stress (2.0 → 0) plus half leverage stress (ND/EBITDA 1 → 0, 7 → 100). Operations = on-time level (90% → 0, 75% → 100) plus Jan-to-latest change. Geography = mean of hazard, logistics and infrastructure indices. Concentration comes from allocation share, ownership roll-up, documented sole sourcing and fan-in.</li><li><b>Missing data.</b> Imputed at 60 in the prudent score; the known-only score is shown beside it.</li><li><b>Criticality.</b> Share of the $${TOT}m product revenue that flows through the node, weighted by allocation; inferred links count 0.7 and hypotheses 0.3. <b>Priority</b> = risk × criticality; High ≥ 55, Medium ≥ 35.</li><li><b>Evidence confidence.</b> 75% link evidence (base 60/40/15 by class, +10 per extra distinct record, max +30) plus 25% indicator completeness. Kept apart from risk.</li><li><b>Limits.</b> No spend or PO data; scores are screening aids; weights and the sole-source defaults are assumptions to calibrate with sourcing.</li></ul></div>
<div class="cd"><h2>Entities and records deliberately not linked</h2><div class="wrap"><table><tr><th>Item</th><th>Reason</th><th>Evidence</th></tr>${X.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div></div>`}
function nodeD(id){const{r,c,p,b,cf}=SC[id],d=r.d,[nme,t,site,z,inp,v]=N[id],vv=(x,f)=>x==null?'':f(x),raw={fin:vv(v[0],x=>`CR ${x}, ND/EBITDA ${v[1]}`),op:vv(v[2],x=>`on-time ${x}% (${v[3]>0?'+':''}${v[3]}pp)`),geo:vv(v[5],x=>`hazard ${x}, logistics ${v[6]}, infra ${v[7]}`),asr:vv(v[4],x=>`index ${x}`),str:structWhy(id)},pr=[...prods(id)],ev=evOf(id);
const lk=(l,i)=>`<details><summary>${l.d=='ND'?`${nme} → NovaDrive: ${l.c} ~${l.a*100}%`:`${nm(l.s)} → ${nm(l.d)}: ${l.c}`} ${kc(l.k)} ${chip('conf '+lconf(l))}</summary><ul>${l.ev.map(e=>{const x=evi(e,l);return`<li><b>${x.id}</b> · ${x.dt} · ${x.ty}<br><span class="sub">${x.g}</span></li>`}).join('')}</ul></details>`;
return`<h2>${nme}</h2><div class="sub">Tier ${t} · ${inp} · ${site} / ${z} ${kc(clsOf(id))}${id=='247'||id=='725'?' '+chip('owned by CommonSpan'):''}</div>
<div class="cd" style="margin-top:8px"><b>Priority ${f0(p)} (${b})</b> = risk ${f0(r.pru)} × criticality ${f0(c)}/100<br><b>Evidence confidence ${cf}/100</b> <span class="sub">(separate from risk)</span><br><span class="sub">Revenue exposed: ${pr.join(', ')||'none'} ($${rv(pr)}m)</span></div>
<h3>Why this risk score</h3><table><tr><th>Dimension</th><th>Inputs</th><th>Score</th><th>Wt</th></tr>${Object.keys(W).map(k=>`<tr><td>${WL[k]}</td><td class="sub">${raw[k]||'no data in workbook'}</td><td>${d[k]==null?'n/a → 60':f0(d[k])}</td><td>${W[k]}%</td></tr>`).join('')}</table>${r.gap.length?`<p class="sub">Missing: ${r.gap.map(k=>WL[k]).join(', ')}. Imputed at 60, so the prudent score is ${f0(r.pru)} versus ${f0(r.kn)} on known data alone.</p>`:''}
<h3>Suppliers behind it</h3>${inn(id).map(lk).join('')||'<span class="sub">No upstream links in the supplied evidence.</span>'}<h3>Who it supplies</h3>${out(id).map(lk).join('')}
${ev.length?`<h3>Matched alerts</h3>${ev.map(e=>`<div>${chip(e[7],e[7]=='High'?'hi':'md')} <button class="l" data-t="al">${e[0]} ${e[2]}</button></div>`).join('')}`:''}${AL[id]?`<p><button class="b" data-a="${id}">Find alternates</button></p>`:''}`}
function linkD(i){const l=L[i];return`<h2>${nm(l.s)} → ${nm(l.d)}</h2><div class="sub">${l.c} ${kc(l.k)} ${chip('confidence '+lconf(l))}</div>${l.ev.map(e=>{const x=evi(e,l);return`<div class="step"><b>${x.id}</b> · ${x.dt} · ${x.ty}<br>${x.g}</div>`}).join('')}${l.k!='C'?'<p class="sub">Not confirmed: validate with sourcing before relying on this link.</p>':''}`}
function candD(i){const c=AL[vis.alt].c[i];return`<h2>${c.n}</h2><div class="sub">For ${AL[vis.alt].cp} · replacing ${nm(vis.alt)}</div>${c.s?`<h3>Fitment ${fit(c.s)}/100</h3><table>${FW.map((f,j)=>`<tr><td>${f[0]} (${f[1]}%)</td><td>${c.s[j]}/5</td></tr>`).join('')}</table>`:''}<h3>Public evidence</h3><ul>${c.u.map(u=>`<li>${u[1].startsWith('http')?`<a href="${u[1]}" target="_blank" rel="noopener">${u[0]}</a>`:u[0]}<br><span class="sub">${u[2]}</span></li>`).join('')}</ul><h3>Still to validate</h3><p>${c.v}</p><p class="sub">Evidence quality: ${c.cf}. Scores are analyst judgements from the sources above, not verified capability.</p>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-n],[data-l],[data-c],[data-a],[data-x]');if(!t)return;const q=t.dataset;if(q.x)closeD();else if(q.t)go(q.t);else if(q.a)go('at',q.a);else if(q.n)openD(nodeD(q.n));else if(q.l)openD(linkD(+q.l));else if(q.c)openD(candD(+q.c))});
document.addEventListener('change',e=>{if(e.target.id=='fp'){vis.prod=e.target.value;draw()}if(e.target.id=='fh'){vis.hyp=e.target.checked?1:0;draw()}if(e.target.id=='fa'){vis.alt=e.target.value;draw()}});
draw();
</script></body></html>
